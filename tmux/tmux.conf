# Monokai Pro Spectrum, matching Neovim and Kitty.
set -g status-style 'bg=#11100f,fg=#cccccc'
set -g message-style 'bg=#191919,fg=#cccccc'
set -g message-command-style 'bg=#191919,fg=#fce566'
set -g mode-style 'bg=#525053,fg=#cccccc'
set -g pane-border-style 'fg=#525053'
set -g pane-active-border-style 'fg=#fce566'
set -g window-status-style 'bg=#11100f,fg=#8b888f'
set -g window-status-current-style 'bg=#fce566,fg=#11100f,bold'
set -g window-status-activity-style 'fg=#fc618d'
